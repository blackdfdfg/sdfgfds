<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Maya</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  cursor: none;
}

canvas#hearts { position: fixed; top: 0; left: 0; z-index: 0; }
canvas#particles { position: fixed; top: 0; left: 0; z-index: 1; }

.container {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 10;
  perspective: 1000px;
}

.main-text {
  font-size: 5rem;
  font-weight: 900;
  background: linear-gradient(135deg, #ff006e, #ff4da6, #ff006e, #c9184a);
  background-size: 400% 400%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradientShift 3s ease infinite, textAppear 2s ease forwards, float 4s ease-in-out infinite;
  text-shadow: 0 0 40px rgba(255,0,110,0.5);
  opacity: 0;
  letter-spacing: 8px;
}

.maya-text {
  font-size: 8rem;
  font-weight: 900;
  background: linear-gradient(135deg, #ff006e, #ff758f, #ff006e, #ff4da6);
  background-size: 400% 400%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradientShift 2s ease infinite, mayaAppear 2s ease 1s forwards, pulse 2s ease-in-out infinite;
  opacity: 0;
  letter-spacing: 20px;
  text-transform: uppercase;
}

.subtitle {
  font-size: 1.8rem;
  color: #ff758f;
  margin-top: 20px;
  opacity: 0;
  animation: fadeInUp 2s ease 2s forwards;
  letter-spacing: 5px;
}

.heart-3d {
  position: fixed;
  width: 200px; height: 200px;
  transform-style: preserve-3d;
  animation: rotate3d 8s linear infinite;
  z-index: 5;
  opacity: 0;
  transition: opacity 1s;
}

.heart-3d.show { opacity: 1; }

.heart-shape {
  position: absolute;
  width: 100%; height: 100%;
  transform: translateZ(0);
}

.heart-shape::before, .heart-shape::after {
  content: '';
  position: absolute;
  width: 120px; height: 180px;
  background: linear-gradient(135deg, #ff006e, #c9184a);
  border-radius: 120px 120px 0 0;
  box-shadow: 0 0 60px rgba(255,0,110,0.6);
}

.heart-shape::before {
  left: 100px; top: 0;
  transform: rotate(-45deg);
  transform-origin: 0 100%;
}

.heart-shape::after {
  left: 0; top: 0;
  transform: rotate(45deg);
  transform-origin: 100% 100%;
}

.layer { position: absolute; width: 100%; height: 100%; }
.layer:nth-child(2) { transform: translateZ(20px) scale(0.95); opacity: 0.9; }
.layer:nth-child(3) { transform: translateZ(40px) scale(0.9); opacity: 0.8; }
.layer:nth-child(4) { transform: translateZ(60px) scale(0.85); opacity: 0.7; }
.layer:nth-child(5) { transform: translateZ(80px) scale(0.8); opacity: 0.6; }

.sparkle {
  position: fixed;
  width: 4px; height: 4px;
  background: #fff;
  border-radius: 50%;
  pointer-events: none;
  z-index: 100;
  animation: sparkleAnim 0.8s ease forwards;
}

@keyframes sparkleAnim {
  0% { transform: scale(0); opacity: 1; }
  50% { transform: scale(1.5); opacity: 1; }
  100% { transform: scale(0); opacity: 0; }
}

@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

@keyframes textAppear {
  0% { opacity: 0; transform: translateY(50px) scale(0.5); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes mayaAppear {
  0% { opacity: 0; transform: translateY(80px) scale(0.3) rotateX(90deg); }
  100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes fadeInUp {
  0% { opacity: 0; transform: translateY(40px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes rotate3d {
  0% { transform: rotateY(0deg) rotateX(10deg); }
  100% { transform: rotateY(360deg) rotateX(10deg); }
}

.ring {
  position: fixed;
  border-radius: 50%;
  border: 2px solid rgba(255,0,110,0.3);
  pointer-events: none;
  z-index: 2;
  animation: ringExpand 3s ease-out infinite;
}

@keyframes ringExpand {
  0% { transform: scale(0); opacity: 1; }
  100% { transform: scale(4); opacity: 0; }
}

.message {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.2rem;
  color: #ff758f;
  opacity: 0;
  animation: fadeInUp 2s ease 3s forwards, glow 2s ease-in-out infinite 3s;
  z-index: 10;
  text-align: center;
}

@keyframes glow {
  0%, 100% { text-shadow: 0 0 10px rgba(255,0,110,0.5); }
  50% { text-shadow: 0 0 30px rgba(255,0,110,0.8), 0 0 60px rgba(255,0,110,0.4); }
}

.butterfly {
  position: fixed;
  font-size: 2rem;
  animation: fly 6s ease-in-out infinite;
  z-index: 8;
  pointer-events: none;
}

@keyframes fly {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  25% { transform: translate(100px, -80px) rotate(10deg); }
  50% { transform: translate(200px, 20px) rotate(-5deg); }
  75% { transform: translate(50px, -40px) rotate(8deg); }
}

.stars-bg {
  position: fixed;
  width: 100%; height: 100%;
  z-index: -1;
}

.star {
  position: absolute;
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle 2s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.5); }
}

.timeline {
  position: fixed;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 30px;
  z-index: 10;
  opacity: 0;
  animation: fadeInUp 2s ease 4s forwards;
}

.timeline-item {
  text-align: center;
  color: #ff758f;
}

.timeline-icon {
  font-size: 2rem;
  margin-bottom: 5px;
}

.timeline-label {
  font-size: 0.9rem;
  opacity: 0.8;
}

.glow-border {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: 3px solid transparent;
  border-image: linear-gradient(45deg, #ff006e, transparent, #ff006e) 1;
  z-index: 3;
  animation: borderGlow 4s linear infinite;
  pointer-events: none;
}

@keyframes borderGlow {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; }
}
</style>
</head>
<body>

<script>
// Stars background
const starsBg = document.getElementById('starsBg');
for (let i = 0; i < 200; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.animationDelay = Math.random() * 3 + 's';
  star.style.animationDuration = (1 + Math.random() * 2) + 's';
  starsBg.appendChild(star);
}

// Heart rain
const heartsCanvas = document.getElementById('hearts');
const hCtx = heartsCanvas.getContext('2d');
heartsCanvas.width = window.innerWidth;
heartsCanvas.height = window.innerHeight;

const hearts = [];
const heartColors = ['#ff006e', '#ff4da6', '#ff758f', '#c9184a', '#ff0a54'];

function drawHeart(x, y, size, color, alpha) {
  hCtx.save();
  hCtx.globalAlpha = alpha;
  hCtx.fillStyle = color;
  hCtx.beginPath();
  const topY = y - size * 0.4;
  hCtx.moveTo(x, y + size * 0.3);
  hCtx.bezierCurveTo(x - size * 0.5, y - size * 0.1, x - size * 0.5, topY - size * 0.3, x, topY);
  hCtx.bezierCurveTo(x + size * 0.5, topY - size * 0.3, x + size * 0.5, y - size * 0.1, x, y + size * 0.3);
  hCtx.fill();
  hCtx.restore();
}

function spawnHeart() {
  hearts.push({
    x: Math.random() * heartsCanvas.width,
    y: -50,
    size: 10 + Math.random() * 25,
    speed: 1 + Math.random() * 3,
    color: heartColors[Math.floor(Math.random() * heartColors.length)],
    alpha: 0.5 + Math.random() * 0.5,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.02 + Math.random() * 0.03
  });
}

function animateHearts() {
  hCtx.clearRect(0, 0, heartsCanvas.width, heartsCanvas.height);
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    h.y += h.speed;
    h.wobble += h.wobbleSpeed;
    const wx = Math.sin(h.wobble) * 2;
    drawHeart(h.x + wx, h.y, h.size, h.color, h.alpha);
    if (h.y > heartsCanvas.height + 50) hearts.splice(i, 1);
  }
  if (Math.random() < 0.15) spawnHeart();
  requestAnimationFrame(animateHearts);
}
animateHearts();

// Particle canvas
const partCanvas = document.getElementById('particles');
const pCtx = partCanvas.getContext('2d');
partCanvas.width = window.innerWidth;
partCanvas.height = window.innerHeight;

const particles = [];
const colors = ['#ff006e', '#ff758f', '#ffffff', '#ff4da6'];

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * partCanvas.width,
    y: Math.random() * partCanvas.height,
    size: Math.random() * 3 + 1,
    speedX: (Math.random() - 0.5) * 1,
    speedY: (Math.random() - 0.5) * 1,
    color: colors[Math.floor(Math.random() * colors.length)],
    alpha: Math.random() * 0.8 + 0.2
  });
}

function connectParticles() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 120) {
        pCtx.strokeStyle = `rgba(255,0,110,${0.15 * (1 - dist / 120)})`;
        pCtx.lineWidth = 0.5;
        pCtx.beginPath();
        pCtx.moveTo(particles[i].x, particles[i].y);
        pCtx.lineTo(particles[j].x, particles[j].y);
        pCtx.stroke();
      }
    }
  }
}

function animateParticles() {
  pCtx.clearRect(0, 0, partCanvas.width, partCanvas.height);
  particles.forEach(p => {
    p.x += p.speedX;
    p.y += p.speedY;
    if (p.x < 0 || p.x > partCanvas.width) p.speedX *= -1;
    if (p.y < 0 || p.y > partCanvas.height) p.speedY *= -1;
    pCtx.fillStyle = p.color;
    pCtx.globalAlpha = p.alpha;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    pCtx.fill();
  });
  pCtx.globalAlpha = 1;
  connectParticles();
  requestAnimationFrame(animateParticles);
}
animateParticles();

// Mouse sparkle trail
document.addEventListener('mousemove', (e) => {
  for (let i = 0; i < 3; i++) {
    const sparkle = document.createElement('div');
    sparkle.className = 'sparkle';
    sparkle.style.left = (e.clientX + (Math.random() - 0.5) * 20) + 'px';
    sparkle.style.top = (e.clientY + (Math.random() - 0.5) * 20) + 'px';
    sparkle.style.background = heartColors[Math.floor(Math.random() * heartColors.length)];
    document.body.appendChild(sparkle);
    setTimeout(() => sparkle.remove(), 800);
  }
});

// Click burst
document.addEventListener('click', (e) => {
  for (let i = 0; i < 20; i++) {
    const sparkle = document.createElement('div');
    sparkle.className = 'sparkle';
    sparkle.style.left = e.clientX + 'px';
    sparkle.style.top = e.clientY + 'px';
    sparkle.style.width = '8px';
    sparkle.style.height = '8px';
    const angle = (i / 20) * Math.PI * 2;
    const dist = 30 + Math.random() * 50;
    sparkle.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    sparkle.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    sparkle.style.animation = 'none';
    sparkle.style.transition = 'all 0.6s ease-out';
    document.body.appendChild(sparkle);
    requestAnimationFrame(() => {
      sparkle.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`;
      sparkle.style.opacity = '0';
    });
    setTimeout(() => sparkle.remove(), 600);
  }
});

// Rings
function createRing() {
  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.style.left = '50%';
  ring.style.top = '50%';
  ring.style.width = '100px';
  ring.style.height = '100px';
  ring.style.marginLeft = '-50px';
  ring.style.marginTop = '-50px';
  document.body.appendChild(ring);
  setTimeout(() => ring.remove(), 3000);
}
setInterval(createRing, 2000);
createRing();

window.addEventListener('resize', () => {
  heartsCanvas.width = window.innerWidth;
  heartsCanvas.height = window.innerHeight;
  partCanvas.width = window.innerWidth;
  partCanvas.height = window.innerHeight;
});
</script>
