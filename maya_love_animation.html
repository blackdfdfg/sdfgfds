<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Maya</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at center,#1a0011 0%,#000 70%);overflow:hidden;font-family:'Georgia',serif;min-height:100vh}

.hearts-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}

.content{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}

.love-text{font-size:4rem;font-weight:bold;color:#ff2d75;text-shadow:0 0 20px #ff2d75,0 0 40px #ff2d75,0 0 80px #ff0066;animation:loveAppear 2s ease-out forwards,pulse 2s ease-in-out infinite 2s;opacity:0;letter-spacing:8px;margin-bottom:10px}

.maya-name{font-size:7rem;font-weight:900;background:linear-gradient(45deg,#ff0066,#ff6b9d,#ff0066,#ff3385);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradientMove 3s ease infinite,mayaAppear 2s ease-out 1s forwards,pulse 2s ease-in-out infinite 3s;opacity:0;letter-spacing:20px;text-transform:uppercase}

.subtitle{font-size:2rem;color:#ff6b9d;margin-top:20px;opacity:0;animation:fadeInUp 2s ease-out 2s forwards;text-shadow:0 0 10px #ff6b9d}

.message-box{margin-top:40px;padding:30px 60px;border:2px solid rgba(255,45,117,0.5);border-radius:20px;background:rgba(255,0,102,0.1);backdrop-filter:blur(10px);opacity:0;animation:fadeInUp 2s ease-out 3s forwards}

.message-box p{font-size:1.4rem;color:#ffb3d1;line-height:2.2}

.timeline{display:flex;gap:50px;margin-top:40px;opacity:0;animation:fadeInUp 2s ease-out 4s forwards}

.timeline-item{text-align:center;color:#ff6b9d}

.timeline-icon{font-size:2.5rem;margin-bottom:8px;animation:bounce 2s ease-in-out infinite}

.timeline-label{font-size:1rem;opacity:0.8}

.floating-hearts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}

.floating-heart{position:absolute;font-size:2rem;animation:floatUp linear infinite;opacity:0.7}

.sparkle{position:fixed;width:6px;height:6px;background:#fff;border-radius:50%;pointer-events:none;z-index:100;animation:sparkleAnim 1s ease forwards}

.glow-circle{position:fixed;border-radius:50%;border:2px solid rgba(255,45,117,0.3);animation:glowExpand 4s ease-out infinite;pointer-events:none;z-index:2}

@keyframes loveAppear{0%{opacity:0;transform:translateY(50px) scale(0.5)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes mayaAppear{0%{opacity:0;transform:translateY(80px) scale(0.3) rotateX(90deg)}100%{opacity:1;transform:translateY(0) scale(1) rotateX(0)}}
@keyframes gradientMove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes fadeInUp{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes floatUp{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:0.7}90%{opacity:0.7}100%{transform:translateY(-100px) rotate(720deg);opacity:0}}
@keyframes sparkleAnim{0%{transform:scale(0);opacity:1}50%{transform:scale(1.5);opacity:1}100%{transform:scale(0);opacity:0}}
@keyframes glowExpand{0%{transform:scale(0);opacity:1}100%{transform:scale(3);opacity:0}}
</style>
</head>
<body>

<canvas class="hearts-canvas" id="heartsCanvas"></canvas>
<div class="floating-hearts" id="floatingHearts"></div>

<div class="content">
  <div class="love-text">I Love You</div>
  <div class="maya-name">Maya</div>
  <div class="subtitle">~ My Future Wife ~</div>
  
  <div class="message-box">
    <p>I love you so much Maya<br>
    I will always be by your side<br>
    You are my everything</p>
  </div>
  
  <div class="timeline">
    <div class="timeline-item">
      <div class="timeline-icon">First Meet</div>
      <div class="timeline-label">Our Beginning</div>
    </div>
    <div class="timeline-item">
      <div class="timeline-icon">Together</div>
      <div class="timeline-label">Always</div>
    </div>
    <div class="timeline-item">
      <div class="timeline-icon">Forever</div>
      <div class="timeline-label">For Life</div>
    </div>
    <div class="timeline-item">
      <div class="timeline-icon">Love You</div>
      <div class="timeline-label">My Heart</div>
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById('heartsCanvas');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const hearts=[];
const particles=[];
const colors=['#ff0066','#ff2d75','#ff6b9d','#ff3385','#ff0044'];

function createHeart(){
return{x:Math.random()*canvas.width,y:canvas.height+50,size:15+Math.random()*30,speed:1+Math.random()*2,color:colors[Math.floor(Math.random()*colors.length)],angle:Math.random()*Math.PI*2,wobble:Math.random()*Math.PI*2,wobbleSpeed:0.02+Math.random()*0.03}
}

function drawHeart(x,y,size,color,angle){
ctx.save();
ctx.translate(x,y);
ctx.rotate(angle);
ctx.fillStyle=color;
ctx.beginPath();
ctx.moveTo(0,-size*0.3);
ctx.bezierCurveTo(-size*0.5,-size*0.8,-size,-size*0.3,-size*0.1,size*0.1);
ctx.lineTo(0,size*0.3);
ctx.lineTo(size*0.1,size*0.1);
ctx.bezierCurveTo(size,-size*0.3,size*0.5,-size*0.8,0,-size*0.3);
ctx.fill();
ctx.restore()
}

function createParticle(){
return{x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*3+1,speedX:(Math.random()-0.5)*0.5,speedY:(Math.random()-0.5)*0.5,color:colors[Math.floor(Math.random()*colors.length)],alpha:Math.random()*0.5+0.2}
}

for(let i=0;i<60;i++)particles.push(createParticle());

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
if(Math.random()<0.1)hearts.push(createHeart());
for(let i=hearts.length-1;i>=0;i--){
const h=hearts[i];
h.y-=h.speed;
h.wobble+=h.wobbleSpeed;
h.x+=Math.sin(h.wobble)*2;
h.angle+=0.02;
drawHeart(h.x,h.y,h.size,h.color,h.angle);
if(h.y<-50)hearts.splice(i,1)
}
particles.forEach(p=>{
p.x+=p.speedX;
p.y+=p.speedY;
if(p.x<0||p.x>canvas.width)p.speedX*=-1;
if(p.y<0||p.y>canvas.height)p.speedY*=-1;
ctx.globalAlpha=p.alpha;
ctx.fillStyle=p.color;
ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
ctx.fill()
});
ctx.globalAlpha=1;
for(let i=0;i<particles.length;i++){
for(let j=i+1;j<particles.length;j++){
const dx=particles[i].x-particles[j].x;
const dy=particles[i].y-particles[j].y;
const dist=Math.sqrt(dx*dx+dy*dy);
if(dist<150){
ctx.strokeStyle='rgba(255,45,117,'+0.2*(1-dist/150)+')';
ctx.lineWidth=0.5;
ctx.beginPath();
ctx.moveTo(particles[i].x,particles[i].y);
ctx.lineTo(particles[j].x,particles[j].y);
ctx.stroke()
}
}}
requestAnimationFrame(animate)
}
animate();

const floatingContainer=document.getElementById('floatingHearts');
const heartSymbols=['<3','<3','<3'];
function createFloatingHeart(){
const heart=document.createElement('div');
heart.className='floating-heart';
heart.textContent='<3';
heart.style.left=Math.random()*100+'%';
heart.style.animationDuration=(5+Math.random()*5)+'s';
heart.style.color=colors[Math.floor(Math.random()*colors.length)];
floatingContainer.appendChild(heart);
setTimeout(()=>heart.remove(),10000)
}
setInterval(createFloatingHeart,400);

document.addEventListener('mousemove',e=>{
for(let i=0;i<2;i++){
const sparkle=document.createElement('div');
sparkle.className='sparkle';
sparkle.style.left=(e.clientX+(Math.random()-0.5)*30)+'px';
sparkle.style.top=(e.clientY+(Math.random()-0.5)*30)+'px';
sparkle.style.background=colors[Math.floor(Math.random()*colors.length)];
document.body.appendChild(sparkle);
setTimeout(()=>sparkle.remove(),1000)
}
});

document.addEventListener('click',e=>{
for(let i=0;i<20;i++){
const sparkle=document.createElement('div');
sparkle.className='sparkle';
sparkle.style.left=e.clientX+'px';
sparkle.style.top=e.clientY+'px';
sparkle.style.width='10px';
sparkle.style.height='10px';
const angle=(i/20)*Math.PI*2;
const dist=50+Math.random()*80;
sparkle.style.transition='all 0.8s ease-out';
document.body.appendChild(sparkle);
requestAnimationFrame(()=>{
sparkle.style.transform='translate('+Math.cos(angle)*dist+'px,'+Math.sin(angle)*dist+'px) scale(0)';
sparkle.style.opacity='0'
});
setTimeout(()=>sparkle.remove(),800)
}
});

function createGlowCircle(){
const circle=document.createElement('div');
circle.className='glow-circle';
circle.style.left='50%';
circle.style.top='50%';
circle.style.width='150px';
circle.style.height='150px';
circle.style.marginLeft='-75px';
circle.style.marginTop='-75px';
document.body.appendChild(circle);
setTimeout(()=>circle.remove(),4000)
}
setInterval(createGlowCircle,3000);
createGlowCircle();

window.addEventListener('resize',()=>{
canvas.width=window.innerWidth;
canvas.height=window.innerHeight
});
</script>
</body>
</html>
